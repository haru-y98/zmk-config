# ErgoArrows ZMK Config

# Bluetooth
CONFIG_ZMK_BLE=y

# Split keyboard
CONFIG_ZMK_SPLIT=y

# USB logging off (save power)
CONFIG_ZMK_USB_LOGGING=n

# Sleep after 15min idle
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ZMK Studio (キーマップをリアルタイム変更できるようにする)
CONFIG_ZMK_STUDIO=y

# RGB LED (SK6812MINI-E / WS2812互換)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
